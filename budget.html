<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Calculator</title>
    <script src="script.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #111827;
            color: white;
        }

        .box {
            max-width: 600px;
            margin: 50px auto;
            padding: 35px;
            background: #1f2937;
            border-radius: 15px;
        }

        h2 {
            color: #38bdf8;
        }

        .form-control {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-control:focus {
            background: #374151;
            color: white;
            border-color: #38bdf8;
            box-shadow: none;
        }

        .logout {
            background: #dc3545;
            border: none;
        }
    </style>
</head>

<body>
    <div class="box shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Budget Calculator</h2>
            <button onclick="logout()" class="btn btn-danger logout">
                Logout
            </button>
        </div>
        <input type="number" id="income" class="form-control mb-3" placeholder="Total Income ₹">
        <input type="number" id="rent" class="form-control mb-3" placeholder="Rent ₹">
        <input type="number" id="groceries" class="form-control mb-3" placeholder="Groceries ₹">
        <input type="number" id="transportation" class="form-control mb-3" placeholder="Transportation ₹">
        <input type="number" id="entertainment" class="form-control mb-3" placeholder="Entertainment ₹">
        <input type="number" id="other" class="form-control mb-3" placeholder="Other Expenses ₹">

        <button onclick="calculateBudget()" class="btn btn-info w-100">Calculate Budget</button>

        <div id="result" class="mt-4 text-center"></div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Budget Calculator</title>
    <script src="script.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #111827;
            color: white;
        }

        .box {
            width: 400px;
            margin: 100px auto;
            padding: 35px;
            background: #1f2937;
            border-radius: 15px;
        }

        h2 {
            color: #38bdf8;
        }

        .form-control {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-control:focus {
            background: #374151;
            color: white;
            border-color: #38bdf8;
            box-shadow: none;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="box shadow-lg">
        <h2 class="text-center mb-4">Create Account</h2>
        <input type="text" id="username" class="form-control mb-3" placeholder="Username">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
        <button onclick="register()" class="btn btn-info w-100">
            Register
        </button>

        <p id="message" class="text-success text-center mt-3"></p>
        <p class="text-center mt-3">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>


</body>

</html>
